[pytest]
testpaths = backend/test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:cacheprovider
    --durations=10
filterwarnings =
    ignore::DeprecationWarning
    ignore::SyntaxWarning

# Make both the project root and backend/ importable so that
# `from app import create_app`, `from database.connection import ...`,
# and `from config import TestingConfig` all resolve when tests
# are run from the project root.
pythonpath =
    .
    backend
    